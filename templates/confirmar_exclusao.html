{% extends "base.html" %}

{% block titulo %}Confirmar exclusão{% endblock %}

{% block conteudo %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <h1 class="h3 mb-3">Confirmar exclusão</h1>
    <div class="alert alert-danger" role="alert">
      <p class="mb-1">Tem certeza de que deseja excluir <strong>{{ object }}</strong>?</p>
      {% if aviso %}<p class="mb-0">{{ aviso }}</p>{% endif %}
    </div>
    <form method="post">
      {% csrf_token %}
      <div class="d-flex flex-wrap gap-2">
        <button type="submit" class="btn btn-danger btn-lg">Sim, excluir</button>
        <a class="btn btn-outline-secondary btn-lg" href="{{ url_voltar }}">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
